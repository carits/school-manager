name: student-check
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: student_check
      POSTGRES_USER: student_check
      POSTGRES_PASSWORD: ${DB_PASSWORD:?required}
    volumes:
      - database:/var/lib/postgresql/data
    mem_limit: 256m
    cpus: 0.40
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U student_check -d student_check"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
  web:
    build: .
    image: student-check-web:7
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: db
      DB_NAME: student_check
      DB_USER: student_check
    ports:
      - "127.0.0.1:8091:8000"
    depends_on:
      db: {condition: service_healthy}
    mem_limit: 512m
    cpus: 0.75
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/xueji/health/',timeout=4)"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  database:
