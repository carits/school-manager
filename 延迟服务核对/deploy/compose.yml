name: yanchi
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: yanchi
      POSTGRES_USER: yanchi
    volumes: [database:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U yanchi -d yanchi"], interval: 10s, timeout: 5s, retries: 10}
  web:
    build: ..
    image: yanchi-web:1
    restart: unless-stopped
    env_file: .env
    environment: {DB_HOST: db, DB_NAME: yanchi, DB_USER: yanchi}
    ports: ["127.0.0.1:8093:8000"]
    depends_on: {db: {condition: service_healthy}}
    mem_limit: 512m
    cpus: 0.75
volumes: {database: {}}
