{% extends 'delaycheck/base.html' %}{% block content %}<section class="card"><div class="eyebrow">{{ student.class_name }} · {{ student.name }}</div><h1>确认联系电话</h1><p class="muted">请确认学校登记的手机号是否正确。手机号有误时可以直接修改。</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>手机号码<input name="phone" value="{{ phone }}" inputmode="tel" maxlength="11" required></label><div class="choices"><label><input type="radio" name="result" value="confirmed" required> 手机号正确</label><label><input type="radio" name="result" value="issue"> 手机号有误</label></div><button class="primary">确认提交</button></form><form method="post" action="{% url 'logout' %}"><button class="link">退出</button></form></section>{% endblock %}
