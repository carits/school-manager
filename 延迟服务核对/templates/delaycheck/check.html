{% extends 'delaycheck/base.html' %}{% block main_class %}page{% endblock %}{% block content %}<div class="page-heading"><div><span class="eyebrow">{{ student.class_name }}班 · {{ student.name }}</span><h1>确认联系电话</h1><p class="muted">请核对学校登记的延时服务联系电话。号码有误时直接修改后提交。</p></div><span class="step-count">手机核对</span></div><section class="panel"><div class="field-list"><div><div class="field-heading"><h2>手机号码</h2><span class="required-label">请填写并确认</span></div><form method="post">{% csrf_token %}{% if error %}<div class="alert alert-danger" role="alert">{{ error }}</div>{% endif %}<input class="form-control" name="phone" value="{{ phone }}" inputmode="tel" maxlength="11" required placeholder="请输入11位手机号码"><div class="correction"><label class="required-label">核对状态</label><div class="check-options"><label><input type="radio" name="result" value="confirmed" required> 手机号正确</label><label><input type="radio" name="result" value="issue"> 手机号有误</label></div></div><div class="form-actions"><button class="btn btn-primary" type="submit">保存并提交核对结果</button></div></form></div></div></section><form method="post" action="{% url 'logout' %}" class="mt-3">{% csrf_token %}<button class="text-button">退出核对</button></form>{% endblock %}
