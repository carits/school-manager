{% extends 'delaycheck/base.html' %}{% block content %}<section class="card check-card"><div class="eyebrow">{{ student.class_name }}班 · {{ student.name }}</div><h1>确认联系电话</h1><p class="muted">请核对学校登记的延时服务联系电话。号码有误时直接修改后提交。</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>手机号码<input name="phone" value="{{ phone }}" inputmode="tel" maxlength="11" required placeholder="请输入11位手机号码"></label><div class="choices"><label><input type="radio" name="result" value="confirmed" required> 手机号正确</label><label><input type="radio" name="result" value="issue"> 手机号有误</label></div><button class="primary">保存并提交核对结果</button></form><form method="post" action="{% url 'logout' %}"><button class="link">退出核对</button></form></section>{% endblock %}
