{% extends 'delaycheck/base.html' %}{% block content %}<section class="card"><h1>延时服务手机信息核对</h1><p class="muted">请输入学校登记的学生姓名和身份证号。</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>学生姓名<input name="name" required autocomplete="name"></label><label>学生身份证号<input name="identity" required inputmode="numeric" autocomplete="off"></label><label>图形验证码<div class="captcha"><input name="captcha" required maxlength="4" autocomplete="off"><button type="button" id="captcha-button" class="captcha-image" aria-label="刷新验证码"><img id="captcha-image" src="{% url 'captcha' %}" alt="验证码，点击刷新"></button></div><small class="muted">看不清可点击图片刷新</small></label><button class="primary">进入手机核对</button></form></section><script>(function(){var image=document.getElementById('captcha-image');var button=document.getElementById('captcha-button');function refresh(){image.src='{% url 'captcha' %}?t='+new Date().getTime();}button.onclick=refresh;})();</script>{% endblock %}
