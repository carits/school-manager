{% extends 'delaycheck/base.html' %}{% block content %}<section class="card"><h1>延时服务手机信息核对</h1><p class="muted">请输入学校登记的学生姓名和身份证号。</p>{% if error %}<p class="error">{{ error }}</p>{% endif %}<form method="post">{% csrf_token %}<label>学生姓名<input name="name" required autocomplete="name"></label><label>学生身份证号<input name="identity" required inputmode="numeric" autocomplete="off"></label><label>图形验证码<div class="captcha"><input name="captcha" required maxlength="4"><button type="button" id="captcha-button">获取验证码</button></div></label><button class="primary">进入手机核对</button></form></section><script>document.getElementById('captcha-button').onclick=function(){fetch('/yanchi/captcha/').then(function(r){return r.json()}).then(function(x){alert('验证码：'+x.code)})}</script>{% endblock %}
