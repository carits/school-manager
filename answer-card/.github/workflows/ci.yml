name: Linux answer-card CI

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: ci-root-password
          MARIADB_DATABASE: answer_card_ci
          MARIADB_USER: answer_card_ci
          MARIADB_PASSWORD: ci-test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping -h localhost -u root -pci-root-password --silent"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      PROJECTX_MARIADB_HOST: 127.0.0.1
      PROJECTX_MARIADB_PORT: 3306
      PROJECTX_MARIADB_USER: answer_card_ci
      PROJECTX_MARIADB_PASSWORD: ci-test-password
      PROJECTX_MARIADB_DATABASE: answer_card_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install Linux bundler binaries
        run: npm install --no-save --ignore-scripts @rollup/rollup-linux-x64-gnu @esbuild/linux-x64
      - name: Rebuild SQLite module
        run: npm rebuild better-sqlite3
      - name: Typecheck
        run: npm run typecheck
      - name: Build web and server
        run: npm run build
      - name: MariaDB regression
        run: npm run verify:mariadb

  container:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose file
        run: docker compose -f answer-card/compose.yml config
      - name: Build Linux service image
        run: docker build -f answer-card/Dockerfile answer-card
